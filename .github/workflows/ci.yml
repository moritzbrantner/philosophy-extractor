name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout philosophy-extractor
        uses: actions/checkout@v4

      - name: Verify local-only source declaration
        run: |
          jq -e '.schemaVersion == 1 and .cargo.localOnly == true' .coding-tooling.source-deps.json >/dev/null
          jq -e '.cargo.patches | length > 0 and all(.[]; (.package | length > 0) and (.git | length > 0) and (.rev | test("^[0-9a-f]{40}$")) and (.localPath | length > 0))' .coding-tooling.source-deps.json >/dev/null
          if grep -R --line-number --fixed-string 'GH_PACKAGES_TOKEN' .github/workflows; then
            echo "Hosted CI must not depend on private cross-repository source credentials." >&2
            exit 1
          fi

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Explain source verification boundary
        run: |
          echo "Cross-repository Rust build/test verification is performed by the local coding loop against the exact sibling nlp-stack checkout."
          echo "Registry-only build/test remains a release/distribution concern when the candidate intentionally consumes unpublished source."
