name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout philosophy-extractor
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Verify source declaration and exact NLP revisions
        run: |
          jq -e '.schemaVersion == 2 and .cargo.localOnly == true and (.cargo.patches | length == 0)' .coding-tooling.source-deps.json >/dev/null
          python3 scripts/check_nlp_pins.py
          if grep -R --line-number --fixed-string --exclude=ci.yml 'GH_PACKAGES_TOKEN' .github/workflows; then
            echo "Hosted CI must not depend on private cross-repository source credentials." >&2
            exit 1
          fi

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Test workspace
        run: cargo test --locked --workspace
