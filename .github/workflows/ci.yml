name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout philosophy-extractor
        uses: actions/checkout@v4
        with:
          path: philosophy-extractor

      - name: Install system dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              SUDO=sudo
            else
              SUDO=
            fi
            $SUDO apt-get update
            $SUDO apt-get install -y cmake
          fi

      - name: Checkout nlp-stack source
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/nlp-stack
          ref: b720d5ee0afad26b439a77ee4f6ffa0ea9e8f868
          path: nlp-stack

      - name: Checkout source tooling
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/coding-tooling
          ref: f9133fe3ca885c2538d2fc92cd52427f4b7ab738
          path: coding-tooling

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Activate exact NLP source
        working-directory: philosophy-extractor
        run: ./scripts/source-deps activate

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0

      - name: Check formatting
        working-directory: philosophy-extractor
        run: cargo fmt --check

      - name: Build
        working-directory: philosophy-extractor
        run: cargo build --workspace

      - name: Test
        working-directory: philosophy-extractor
        run: cargo test --workspace
