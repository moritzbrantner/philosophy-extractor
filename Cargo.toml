[workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/artifact-store",
    "packages/exporters",
    "packages/model-providers",
    "packages/pipeline",
    "packages/prompts",
    "packages/schema",
    "packages/source-ingestion",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
philosophy-extractor = { path = "packages/pipeline" }
philosophy-extractor-schema = { path = "packages/schema" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
text-core = { package = "moenarch-text-core", version = "=0.1.1" }
text-embeddings = { package = "moenarch-text-embeddings", version = "=0.1.1" }
text-linguistics = { package = "moenarch-text-linguistics", version = "=0.1.1" }
text-retrieval = { package = "moenarch-text-retrieval", version = "=0.1.1" }
thiserror = "2.0.17"
