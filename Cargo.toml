[workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/artifact-store",
    "packages/exporters",
    "packages/model-providers",
    "packages/pipeline",
    "packages/prompts",
    "packages/schema",
    "packages/source-ingestion",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
corpus-core = { package = "moenarch-corpus-core", git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "3619154e23e27f79fc5b6f59ef8bc057eefade23" }
philosophy-extractor = { path = "packages/pipeline" }
philosophy-extractor-schema = { path = "packages/schema" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
text-core = { package = "moenarch-text-core", git = "https://github.com/moritzbrantner/nlp-stack", rev = "1dc7d69b80809aad57839128edd483bcc61f3863" }
text-embeddings = { package = "moenarch-text-embeddings", git = "https://github.com/moritzbrantner/nlp-stack", rev = "1dc7d69b80809aad57839128edd483bcc61f3863" }
text-linguistics = { package = "moenarch-text-linguistics", git = "https://github.com/moritzbrantner/nlp-stack", rev = "1dc7d69b80809aad57839128edd483bcc61f3863" }
text-retrieval = { package = "moenarch-text-retrieval", git = "https://github.com/moritzbrantner/nlp-stack", rev = "1dc7d69b80809aad57839128edd483bcc61f3863" }
thiserror = "2.0.17"
